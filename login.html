<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - GAMER HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="login-wrap" id="loginWrap">
    <img id="playerPhoto" src="" alt="">
    <h1 id="playerName">Loading...</h1>
    <input type="password" id="passInput" placeholder="Enter password">
    <div class="error-msg" id="errorMsg"></div>
    <button id="loginBtn">Enter</button>
  </div>

  <div class="welcome-screen" id="welcomeScreen" style="display:none;">
    <h2 id="roastLine"></h2>
  </div>

  <audio id="voiceSound"></audio>

  <script src="js/login.js"></script>
</body>
</html>
